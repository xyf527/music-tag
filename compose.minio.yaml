# Optional dedicated instance. Use an external endpoint instead when MinIO already exists.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [minio]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set dedicated credentials}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set dedicated credentials}
    volumes:
      - ${MINIO_DATA_ROOT:?Set dedicated MinIO directory}:/data
