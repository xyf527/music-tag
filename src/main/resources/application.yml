spring:
  application:
    name: music-tag
  servlet:
    multipart:
      max-file-size: ${MUSIC_MAX_UPLOAD_MB:500}MB
      max-request-size: ${MUSIC_MAX_UPLOAD_MB:500}MB
server:
  port: ${SERVER_PORT:18082}
music:
  storage-root: ${MUSIC_STORAGE_ROOT:.test-data/storage}
  database:
    host: ${MYSQL_HOST:invalid.example}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:music_tag_claude}
    user: ${MYSQL_USER:invalid_user}
    password: ${MYSQL_PASSWORD:invalid_password}
