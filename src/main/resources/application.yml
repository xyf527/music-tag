server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: music-tagger
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:invalid.example}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:music_tag_codex}}
    username: ${MYSQL_USER:music_tag_codex_user}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
music:
  storage:
    root: ${MUSIC_STORAGE_ROOT:.test-data/storage}
    max-upload-bytes: ${MUSIC_MAX_UPLOAD_BYTES:52428800}
