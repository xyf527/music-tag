<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Tag · 单曲编辑</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:32px 20px}.hero{background:#16233d;color:white;border-radius:20px;padding:28px 32px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,40px)}.hero p{margin:0;color:#c8d2e5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:22px;box-shadow:0 8px 25px #26395d0d}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin:12px 0 6px}input[type=file],input[type=text],textarea,select{width:100%;border:1px solid #ccd5e3;border-radius:10px;padding:11px;font:inherit;background:#fbfcfe}textarea{min-height:120px;resize:vertical}.hint{color:#66738a;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:#2d6cdf;color:white}button.secondary{background:#e8eef8;color:#25426d}.status{padding:12px;border-radius:10px;background:#f0f4fa;margin-top:16px}.status.success{background:#e8f7ee;color:#126333}.status.error{background:#fff0f0;color:#9e2525}.preview{border-left:4px solid #2d6cdf;padding:10px 14px;background:#f6f9ff;white-space:pre-wrap}.cover{max-height:180px;max-width:100%;border-radius:10px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.shell{padding:18px 12px}}
</style></head>
<body><main class="shell"><header class="hero"><h1>单曲标签编辑</h1><p>安全读取、预览并生成新的音乐版本。原文件永不覆盖；MP3、FLAC 支持标签编辑，WAV 会明确提示受限能力。</p></header>
<section class="grid"><div class="card"><h2>1 · 选择音频</h2><p class="hint">支持 MP3、FLAC、WAV；单文件最大 500 MB，可用 MUSIC_MAX_UPLOAD_MB 调整。</p><label for="audio">音频文件</label><input id="audio" type="file" accept=".mp3,.flac,.wav" required><label for="lrc">可选 LRC 歌词</label><input id="lrc" type="file" accept=".lrc,.txt"><label for="cover">可选封面（JPEG/PNG）</label><input id="cover" type="file" accept="image/jpeg,image/png"><div class="actions"><button onclick="upload()">上传并读取标签</button></div></div>
<div class="card"><h2>状态</h2><div id="status" class="status">等待上传</div><dl id="info"><dt>文件信息</dt><dd>尚未选择文件</dd></dl><img id="coverPreview" class="cover" alt="封面预览"></div>
<div id="editor" class="card wide" hidden><h2>2 · 编辑与预览</h2><div class="grid"><div><label>标题</label><input id="title" type="text"><label>歌手</label><input id="artist" type="text"><label>专辑</label><input id="album" type="text"></div><div><label>歌词操作</label><select id="lyricsMode"><option>KEEP</option><option>SET</option><option>REMOVE</option></select><textarea id="lyrics" placeholder="输入歌词或上传 LRC"></textarea><label>封面操作</label><select id="coverMode"><option>KEEP</option><option>SET</option><option>REMOVE</option></select></div></div><h3>变更预览</h3><div id="diff" class="preview">保持现有标签</div><div class="actions"><button onclick="execute()">确认处理并生成新版本</button><button class="secondary" onclick="refreshDiff()">刷新预览</button></div></div>
<div id="result" class="card wide" hidden><h2>3 · 处理结果</h2><div id="resultText" class="status"></div><div class="actions"><a id="download" target="_blank"><button>下载处理后音乐</button></a><a id="report" target="_blank"><button class="secondary">下载 JSON 报告</button></a></div></div></section></main>
<script>let resource=null;const $=id=>document.getElementById(id);function show(text,type=''){ $('status').textContent=text;$('status').className='status '+type }async function upload(){const f=$('audio').files[0];if(!f){show('请选择音频文件','error');return}show('上传中，请稍候…');const fd=new FormData();fd.append('audio',f);try{const r=await fetch('/api/single/upload',{method:'POST',body:fd});if(!r.ok)throw new Error(r.status===413?'文件超过大小限制，请选择不超过 500 MB 的文件':'上传失败，请检查格式和文件内容');resource=await r.json();$('info').innerHTML='<dt>文件名</dt><dd>'+resource.originalFilename+'</dd><dt>格式</dt><dd>'+resource.format.toUpperCase()+'</dd><dt>大小</dt><dd>'+Math.round(resource.size/1024)+' KB</dd><dt>原件 SHA-256</dt><dd>'+resource.sha256+'</dd>';['title','artist','album'].forEach(k=>$(k).value=resource.metadata?.[k]||'');$('editor').hidden=false;show('读取完成，可编辑','success');refreshDiff()}catch(e){show(e.message,'error')}}function refreshDiff(){if(!resource)return;const rows=[['标题','title'],['歌手','artist'],['专辑','album']];$('diff').textContent=rows.map(([n,k])=>n+'：'+($(k).value===resource.metadata?.[k]?'KEEP':(resource.metadata?.[k]?'修改为 ':'设置为 ')+$(k).value)).join('\n')+'\n歌词：'+$('lyricsMode').value+'\n封面：'+$('coverMode').value}async function execute(){if(!resource)return;show('处理中，请稍候…');const plan={title:$('title').value,titleMode:$('title').value===resource.metadata?.title?'KEEP':'SET',artist:$('artist').value,artistMode:$('artist').value===resource.metadata?.artist?'KEEP':'SET',album:$('album').value,albumMode:$('album').value===resource.metadata?.album?'KEEP':'SET',lyrics:$('lyrics').value,lyricsMode:$('lyricsMode').value,cover:null,coverMode:$('coverMode').value};const r=await fetch('/api/single/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resourceId:resource.resourceId,plan})});const data=await r.json();$('result').hidden=false;$('resultText').textContent=data.status==='SUCCEEDED'?'处理成功，已生成新版本。':'处理失败：'+(data.errorCode||'未知错误');$('resultText').className='status '+(data.status==='SUCCEEDED'?'success':'error');if(data.status==='SUCCEEDED'){$('download').href='/api/single/download?versionId='+encodeURIComponent(data.versionId);$('report').href='/api/single/report?taskId='+encodeURIComponent(data.taskId)}else{show('处理被拒绝：'+(data.errorCode||'格式能力不支持'),'error')}}$('cover').onchange=()=>{};</script></body></html>
