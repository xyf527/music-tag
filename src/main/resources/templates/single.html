<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Music Tag 单曲编辑</title></head>
<body><h1>单曲编辑</h1><p>上传 MP3、FLAC 或 WAV；WAV 的标签写入能力会在预览阶段明确提示。</p>
<form method="post" action="/api/single/upload" enctype="multipart/form-data"><label>音频 <input type="file" name="audio" accept=".mp3,.flac,.wav" required></label><button>上传并预览</button></form>
</body></html>
