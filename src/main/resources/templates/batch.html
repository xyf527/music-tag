<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量导入工作台</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.shell{max-width:1000px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #dce3ed;border-radius:16px;padding:22px;margin:16px 0}.button{border:0;border-radius:9px;padding:10px 14px;background:#315efb;color:#fff;font:inherit;font-weight:700;cursor:pointer;margin:4px}.button:disabled{opacity:.45}.muted{color:#657087}.status{white-space:pre-wrap;background:#f4f6fa;border-radius:9px;padding:12px}.bad{color:#b42318}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #dce3ed;text-align:left;padding:8px;overflow-wrap:anywhere}a{color:#315efb}</style></head><body><main class="shell"><a href="/">← 单曲处理</a><h1>批量导入工作台</h1><p class="muted">选择多个文件或一个目录；只按相对目录和完整文件名唯一匹配，不会猜测。</p><section class="card"><input id="files" type="file" multiple webkitdirectory accept=".mp3,.flac,.wav,.lrc,.jpg,.jpeg,.png"><button id="upload" class="button">上传并生成匹配计划</button><div id="status" class="status">尚未选择文件。</div></section><section id="plan" class="card" hidden><h2>不可变处理计划</h2><p class="muted">冲突项可勾选跳过；确认后才可执行。</p><table><thead><tr><th>路径</th><th>类型</th><th>状态</th><th>匹配依据</th><th>操作</th></tr></thead><tbody id="items"></tbody></table><button id="confirm" class="button">确认计划</button><button id="execute" class="button" disabled>执行</button><button id="retry" class="button" disabled>仅重试失败项</button><a id="zip" hidden>下载 ZIP 与报告</a></section></main><script>
let taskId;const $=id=>document.getElementById(id),status=$('status');
const show=x=>{status.textContent=x};
async function refresh(){const d=await fetch('/api/batches/'+taskId).then(r=>r.json());$('items').innerHTML=d.items.map(i=>`<tr><td>${i.relativePath}</td><td>${i.kind}</td><td>${i.status}${i.userMessage?'：'+i.userMessage:''}</td><td>${i.matchBasis||''}</td><td>${i.kind==='AUDIO'&&i.status==='CONFLICT'?'<label><input type="checkbox" name="skip" value="'+i.id+'">跳过</label>':''}</td></tr>`).join('');show('任务状态：'+d.task.status+'\n'+JSON.stringify(d.counts));const done=/COMPLETED/.test(d.task.status);$('execute').disabled=d.task.status!=='CONFIRMED';$('retry').disabled=!done;$('zip').hidden=!done;$('zip').href='/api/batches/'+taskId+'/zip';}
$('upload').onclick=async()=>{const fs=[...$('files').files];if(!fs.length)return show('请选择文件或目录');const fd=new FormData;fs.forEach(f=>{fd.append('files',f);fd.append('paths',f.webkitRelativePath||f.name)});const r=await fetch('/api/batches',{method:'POST',body:fd});const d=await r.json();if(!r.ok)return show(d.message||'上传失败');taskId=d.id;$('plan').hidden=false;await refresh()};
$('confirm').onclick=async()=>{const p=new URLSearchParams;document.querySelectorAll('input[name=skip]:checked').forEach(x=>p.append('skipIds',x.value));const r=await fetch('/api/batches/'+taskId+'/confirm?'+p,{method:'POST'});if(!r.ok){const d=await r.json();return show(d.message||'确认失败')}await refresh()};
$('execute').onclick=async()=>{await fetch('/api/batches/'+taskId+'/execute',{method:'POST'});const t=setInterval(async()=>{await refresh();const d=await fetch('/api/batches/'+taskId).then(r=>r.json());if(/COMPLETED/.test(d.task.status))clearInterval(t)},500)};
$('retry').onclick=async()=>{await fetch('/api/batches/'+taskId+'/retry',{method:'POST'});await refresh()};
</script></body></html>
